kind = "web"
previewPath = "/"
title = "Crime Intelligence Platform"
version = "1.0.0"
id = "artifacts/crime-intelligence"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21780

[services.development]
run = "pnpm --filter @workspace/crime-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crime-intelligence", "run", "build" ]
serve = "static"
publicDir = "artifacts/crime-intelligence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21780"
BASE_PATH = "/"
